<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Cailín Club</title>
    <style>
        /* Normalize Box Sizing */
        * {
            box-sizing: border-box;
        }

        /* General Page Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #d1b9f4; /* Match the lavender background color */
            color: #000; /* Text color */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Allow scrolling if needed */
        }

        /* Wrapper to prevent image cropping */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 20px; /* Ensures space above */
            flex-grow: 1; /* Pushes content dynamically */
        }

        /* Styling for the logo image */
        .logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        /* Text styling */
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="email"] {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #7c659b; /* Button color */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #7c659b; /* Button color */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 50px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #7c659b; /* Button color */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 20px; /* Space between button and line */
        }

        .line {
            display: block; /* Ensures it takes space */
            width: 50%;
            height: 2px;
            background-color: #333; /* Ensure it's visible */
            margin: 20px auto; /* Center it and add space */
        }

        /* Media Query for Mobile Responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 16px;
            }

            .logo {
                max-width: 300px;
            }

            input[type="email"], input[type="submit"] {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <!-- Image -->
        <img class="logo" src="./assets/Screenshot 2024-09-23 at 20.05.43.png" alt="Creative Cailín Club Logo">

        <!-- Text Content -->
        <h1>Design, Create, Thrive: Building Your Creative Business</h1>
        <p>Join us for an inspiring and practical one-day course designed to help you build and grow your creative business.</p>
        
        <a href="https://bit.ly/4jOVJwm" class="button">Book Ticket</a>

        <div class="line"></div>    

        <p>Sign up to receive exclusive updates</p>

        <!-- Email Signup Form -->
        <form action="https://formspree.io/f/mjkbqpzk" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="submit" value="Sign Up">
        </form>
    </div>

</body>
</html>
